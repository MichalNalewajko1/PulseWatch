<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PulseWatch Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="/dashboard/dashboard.js" defer></script>

</head>

<body>
    <header class="page-header">
        <h1>PulseWatch</h1>
        <p>Monitor zasobów systemowych</p>
    </header>

    <main class="dashboard">
        <section class="snapshot-panel">
            <h2>Ostatni pomiar</h2>

            <p id="status">
                Pobieranie danych...
            </p>

            <div class="device-info">
                <p>
                    Komputer:
                    <strong id="computerName">-</strong>
                </p>

                <p>
                    Czas pomiaru:
                    <strong id="timestamp">-</strong>
                </p>
            </div>

            <div class="metrics-grid">
                <article class="metric-card cpu-card" id="cpuCard">
                    <h3>CPU</h3>
                    <p id="cpuUsage">-</p>

                    <progress id="cpuProgress" class="usage-progress" value="0" max="100"></progress>
                </article>

                <article class="metric-card ram-card" id="ramCard">
                    <h3>RAM</h3>
                    <p id="ramUsage">-</p>

                    <progress id="ramProgress" class="usage-progress" value="0" max="100"></progress>
                    <p id="ramDetails" class="metric-details">-</p>

                </article>

                <article class="metric-card disk-card" id="diskCard">
                    <h3>Dysk</h3>
                    <p id="diskUsage">-</p>

                    <progress id="diskProgress" class="usage-progress" value="0" max="100"></progress>
                    <p id="diskDetails" class="metric-details">-</p>
                </article>
            </div>
        </section>
        <section class="chart-panel">
            <h2>Historia wykorzystania zasobów</h2>
            <div class="chart-wrapper">
                <canvas id="usageHistoryChart"></canvas>
            </div>
        </section>
        <section class="history-panel">
            <h2>Historia pomiarów</h2>

            <div class="table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Czas</th>
                            <th>Komputer</th>
                            <th>CPU</th>
                            <th>RAM</th>
                            <th>Dysk</th>
                        </tr>
                    </thead>

                    <tbody id="historyBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
